<!DOCTYPE html>
<html lang="pl" data-theme="szkola-krem" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zegar — Ćwiczenia (podgląd)</title>
<!-- PREVIEW of the exercises before they are wired into index.html: sim.html?app=cwiczenia.html (?poziom=2, ?typ=1 Pokaż | 2 Wybierz
     (level 10: 1 Ustaw | 2 unusual dials | 3 from other levels), ?styl=,
     ?samouczek=1 (&krok=N) — the level's tutorial (samouczki.js); encoded inside sim.html: sim.html?app=cwiczenia.html%3Fpoziom%3D2).
     Copies from index.html only what cwiczenia.js needs. To be deleted after the merge.
     Merging: <script src="cwiczenia.js"> after tarcza.js · the „Ćwiczenia" view in the ☰ menu (list: Godziny …) ·
     the counter in the header · the "exercises" CSS block below. -->
<link rel="stylesheet" href="lib/daisyui.css">
<link rel="stylesheet" href="lib/daisyui-themes.css">
<link rel="stylesheet" href="theme-milioni.css">
<link rel="stylesheet" href="theme-szkola.css">
<link rel="stylesheet" href="theme-dzieci.css">
<link rel="stylesheet" href="tarcza.css">
<script src="lib/tailwind.js"></script>
<script src="sim-bridge.js"></script>
<script src="tarcza.js"></script>
<script src="lekcja-uplyw.js"></script>
<script src="cwiczenia.js"></script>
<script src="samouczki.js"></script>
<style type="text/tailwindcss">
  @theme reference {
    --color-base-100: var(--color-base-100); --color-base-200: var(--color-base-200); --color-base-300: var(--color-base-300);
    --color-base-content: var(--color-base-content);
    --color-primary: var(--color-primary); --color-primary-content: var(--color-primary-content);
    --color-secondary: var(--color-secondary); --color-secondary-content: var(--color-secondary-content);
    --color-accent: var(--color-accent); --color-accent-content: var(--color-accent-content);
    --color-neutral: var(--color-neutral); --color-neutral-content: var(--color-neutral-content);
    --color-info: var(--color-info); --color-success: var(--color-success);
    --color-warning: var(--color-warning); --color-error: var(--color-error);
  }
</style>
<style>
  /* as in index.html */
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--color-base-200);
    color: var(--color-base-content);
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
    --tekst-g: var(--color-base-content); --tekst-m: var(--color-base-content);
    --r-glowny: 32px; --r-przycisk: 22px; --r-drobny: 17px;   /* the size standard — as in index.html */
  }
  body[data-styl="szkolny"] { --tekst-g: var(--godz); --tekst-m: var(--min); }
  .g { color: var(--tekst-g); }
  .m { color: var(--tekst-m); }

  /* exercises (cwiczenia.js) — to be moved into index.html. Sizes = the app standard:
     main 32 · button 22 · small 17.
     Above the clock the question box, below it the area for 3 buttons (empty in Pokaż) — both of fixed height, so the clock
     stays in the same place. Words are long („Dziewiąta") — their 3 buttons are stacked, hence the height of the area. */
  #cw { justify-content: safe center; }
  .licznik { margin-left: auto; padding-right: .75rem; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;
             color: color-mix(in oklab, var(--color-base-content) 70%, transparent); }
  .cw-zegar svg { display: block; width: min(88vw, 50vh); height: auto; }
  .cw-pytanie { width: min(88vw, 50vh); height: 88px; box-sizing: border-box; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 2px; text-align: center;
                background: var(--color-base-100); border: 2px solid var(--color-base-300); border-radius: var(--radius-box, 1rem); }
  .cw-pytanie small { font-size: var(--r-drobny); line-height: 1.35; color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }
  .cw-pytanie b { font-size: var(--r-glowny); line-height: 1.2; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cw-cel { height: 168px; display: flex; align-items: flex-start; justify-content: center; }
  .cw-wybor { display: flex; gap: 12px; }
  .cw-wybor .btn { width: 6rem; padding-inline: 0; font-size: var(--r-przycisk); font-variant-numeric: tabular-nums; }
  .slowa .cw-wybor, .zdania .cw-wybor { flex-direction: column; gap: 10px; }
  .slowa .cw-wybor .btn { width: 14rem; }
  /* level 4: whole sentences („Piętnaście po jedenastej") — 22 in the box instead of 32, buttons almost full width */
  .zdania .cw-wybor .btn { width: 18rem; }
  .cw-pytanie.zdania small + b { font-size: var(--r-przycisk); }   /* only the sentence in Pokaż; „Która godzina?" stays 32 */
  /* level 6: „Dwadzieścia pięć po jedenastej" does not fit in 18rem — the buttons take two lines, all three equal,
     the area is taller (3 × 62 + 2 × 8) so that the clock does not jump within a round */
  .cw-cel.dwa-wiersze { height: 202px; }
  .dwa-wiersze .cw-wybor { gap: 8px; }
  .dwa-wiersze .cw-wybor .btn { height: 62px; line-height: 1.2; }
  /* level 9: the textbook bridge 13:50 → 14:00 → 14:10 — the jumps above the arrows, the total below; 3 buttons underneath */
  .cw-cel.most { flex-direction: column; align-items: center; gap: 10px; }
  .cw-most { width: min(88vw, 50vh); display: grid; grid-template-columns: auto 1fr auto 1fr auto; align-items: center; row-gap: 4px; }
  .cw-most .czas { grid-row: 2; padding: 2px 8px; font-size: var(--r-przycisk); font-weight: 700; font-variant-numeric: tabular-nums;
                   background: var(--color-base-100); border: 2px solid var(--color-base-300); border-radius: .5rem; }
  .cw-most .strz { grid-row: 2; text-align: center; font-size: var(--r-przycisk);
                   color: color-mix(in oklab, var(--color-base-content) 50%, transparent); }
  .cw-most .skok, .cw-most .razem { font-size: var(--r-drobny); line-height: 1.5; text-align: center; white-space: nowrap; min-height: 1.5em; }
  .cw-most .s1 { grid-row: 1; grid-column: 1 / 4; }
  .cw-most .s2 { grid-row: 1; grid-column: 3 / 6; }
  .cw-most .razem { grid-row: 3; grid-column: 1 / -1; }
  .cw-most .teraz b { display: inline-block; min-width: 1.6em; border-radius: .4rem;
                      background: var(--color-warning); color: var(--color-warning-content); }
  .cw-most .zrobione { color: var(--color-success); font-weight: 700; }
  /* level 10: Ustaw — both hands separately, then „Sprawdź" (no click sound from dzwieki.js — it has its own right / wrong) */
  .cw-sprawdz { width: 14rem; font-size: var(--r-przycisk); }
  /* bonus: „Minęły 2 godziny i 25 minut" does not fit at 32 — 22, at most 2 lines (17 + 2 × 26 < 88) */
  .cw-pytanie.minelo b { font-size: var(--r-przycisk); }
  .cw-wybor .btn:not(.btn-success, .btn-error) { --btn-color: var(--color-base-100); }
  .cw-kolko { fill-opacity: .45; }
  .cw-kolko.dobrze { fill: var(--color-success); }
  .cw-kolko.zle { fill: var(--color-error); }
  .cw-wynik { margin: 0; font-size: var(--r-glowny); font-weight: 700; }
  .cw-punkty { margin: 0 0 8px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
  .cw-punkty b { font-size: var(--r-glowny); font-variant-numeric: tabular-nums; }
  .cw-punkty small { font-size: var(--r-drobny); color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }
  .cw-koniec { width: 100%; max-width: 20rem; display: flex; flex-direction: column; gap: 10px; }
  .cw-koniec .btn { font-size: var(--r-przycisk); }
  .cw-koniec .btn:not(.btn-primary) { --btn-color: var(--color-base-100); }
  /* tutorial (samouczki.js): the whole help sits in one frame, so it is clear this is not the ordinary clock — background
     and outline in the theme colour, at the top a label like „Dobra rada" in the lessons. Inside: the sentence at 22
     (32 does not fit; room for 2 lines — the clock does not jump), a clock a little smaller than in a round, below it
     the big caption 32, the small description 17 and „Dalej" / „Wróć". The hand being talked about blinks; the minute
     labels (05 … 55) are hidden and light up during counting. */
  .sam-ramka { width: min(100%, 24rem); box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
               gap: 8px; padding: 8px 12px 14px; border-radius: var(--radius-box, 1rem);
               background: color-mix(in oklab, var(--color-primary) 12%, var(--color-base-100));
               border: 2px solid color-mix(in oklab, var(--color-primary) 55%, var(--color-base-100)); }
  .sam-gora { height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
              text-align: center; }
  .sam-znak { font-size: var(--r-drobny); font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
              line-height: 1.2; color: var(--color-primary); }
  .sam-gora p { margin: 0; font-size: var(--r-przycisk); line-height: 1.2; }
  .sam-zegar svg { display: block; width: min(80vw, 44vh); height: auto; }
  .sam-pod { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sam-duzy { margin: 0; font-size: var(--r-glowny); font-weight: 700; line-height: 1.2; min-height: 1.2em; font-variant-numeric: tabular-nums; }
  .sam-maly { margin: 0; font-size: var(--r-drobny); line-height: 1.35; min-height: 1.35em; font-variant-numeric: tabular-nums;
              color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }
  .sam-dalej { width: 12rem; margin-top: 4px; font-size: var(--r-przycisk); }
  .sam-ukryty { visibility: hidden; }
  .sam-swieci { animation: sam-miga 1s ease-in-out infinite; }
  @keyframes sam-miga { 50% { opacity: .2; } }
  .sam-palec { font-size: 30px; text-anchor: middle; dominant-baseline: hanging; }
  /* level 3: the right half of the dial is „po", the left „za" — the words po / za use the same colours */
  :root { --sam-po: #e39a00; --sam-za: #8b55cc; }
  .sam-po { color: var(--sam-po); }
  .sam-za { color: var(--sam-za); }
  .zegar .sam-pol-po { fill: var(--sam-po); fill-opacity: .2; }
  .zegar .sam-pol-za { fill: var(--sam-za); fill-opacity: .16; }
  /* level 4: the dial cut into 4 pieces of 15 minutes (the pieces — .sektor, like the elapsed-time wedge) */
  .zegar .sam-ciecie { fill: none; stroke: color-mix(in oklab, var(--color-base-content) 35%, transparent); stroke-width: 1.5; stroke-linecap: round; }
  /* each piece has its own green, from light (12 → 3) to dark (9 → 12) */
  .zegar .sam-cwiartka.c0 { fill-opacity: .16; } .zegar .sam-cwiartka.c1 { fill-opacity: .3; }
  .zegar .sam-cwiartka.c2 { fill-opacity: .44; } .zegar .sam-cwiartka.c3 { fill-opacity: .58; }
  /* level 6: big caption = a sentence, up to 2 lines („Dwadzieścia pięć po szóstej") — always room for 2, the clock does not jump;
     the sentence is in a single <span> (samZdanie), so flex only centres it */
  .sam-dwa .sam-duzy { min-height: 2.4em; display: flex; align-items: center; justify-content: center; text-align: center; }
</style>
</head>
<body>

<div class="h-full flex flex-col">
  <header class="flex items-center gap-1 px-2 h-14 shrink-0">
    <button id="wstecz" class="btn btn-ghost btn-square" aria-label="Wróć do listy">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>
    </button>
    <span class="text-lg font-bold" id="tytul">Poziom 1</span>
    <span class="licznik" id="licznik"></span>
    <!-- 💡 the level's tutorial (samouczki.js); in index.html it sits before 🏠 -->
    <button id="pomoc" class="btn btn-ghost btn-square" aria-label="Jak to działa?" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/></svg>
    </button>
  </header>
  <main id="cw" class="flex-1 min-h-0 overflow-y-auto flex flex-col items-center gap-3 px-4 pb-6"></main>
</div>

<script>
"use strict";
// ---- copied from index.html ----
const NS = 'http://www.w3.org/2000/svg';
function noweSvg(cls) { const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', cls); return s; }
function h(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const RAMA = { minimalny: '3' };
const GODZ = ['dwunasta','pierwsza','druga','trzecia','czwarta','piąta','szósta','siódma','ósma','dziewiąta','dziesiąta','jedenasta'];
const GODZ_EJ = ['dwunastej','pierwszej','drugiej','trzeciej','czwartej','piątej','szóstej','siódmej','ósmej','dziewiątej','dziesiątej','jedenastej'];
const duza = s => s.charAt(0).toUpperCase() + s.slice(1);
const MINUTY = ['pełna godzina', 'pięć po', 'dziesięć po', 'piętnaście po', 'dwadzieścia po', 'dwadzieścia pięć po',
                'wpół do', 'za dwadzieścia pięć', 'za dwadzieścia', 'za piętnaście', 'za dziesięć', 'za pięć'];
function pora(tm) {
  const g = Math.floor(tm / 60);
  return g >= 5 && g < 12 ? 'rano' : g >= 12 && g < 18 ? 'po południu' : g >= 18 && g < 23 ? 'wieczorem' : 'w nocy';
}

// ---- preview ----
const q = new URLSearchParams(location.search);
let styl = q.get('styl');
if (!styl) try { styl = localStorage.getItem('zegar-styl'); } catch (e) {}
if (!['szkolny', 'minimalny', 'klasyczny'].includes(styl)) styl = 'szkolny';
document.body.dataset.styl = styl;

const typ = Math.min(3, Math.max(0, +q.get('typ') || 0));
const nrPoz = Math.min(CW_POZIOMY.length, Math.max(1, +q.get('poziom') || 1)) - 1;
document.getElementById('tytul').textContent = `Poziom ${nrPoz + 1}`;
const box = document.getElementById('cw'), licznik = document.getElementById('licznik');
// in the app ← / „Wróć" = the exercise list; here the round starts over (the first time the tutorial comes first)
const runda = () => cwiczenia(box, licznik, wroc, nrPoz, typ);
const start = () => cwStart(box, licznik, nrPoz, runda);
function wroc() { log('← (w aplikacji: lista ćwiczeń) — tu nowa runda'); start(); }
document.getElementById('wstecz').onclick = wroc;
window.simBack = wroc;
const pomoc = document.getElementById('pomoc');
pomoc.hidden = !samouczekJest(nrPoz);
pomoc.onclick = () => samouczek(box, licznik, nrPoz, runda);
// ?samouczek=1 — always show the tutorial (even if already seen); &krok=N — from step N
if (q.has('samouczek') || q.has('krok')) samouczek(box, licznik, nrPoz, runda, (+q.get('krok') || 1) - 1);
else start();
</script>
</body>
</html>
