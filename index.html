<!DOCTYPE html>
<html lang="pl" data-theme="szkola-krem" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zegar</title>
<!-- themes from Szkoła (Sunny-Librus/sim): daisyUI + szkola · szkola-krem · szkola-blekit · szkola-noc · milioni -->
<link rel="stylesheet" href="lib/daisyui.css">
<link rel="stylesheet" href="lib/daisyui-themes.css">
<link rel="stylesheet" href="theme-milioni.css">
<link rel="stylesheet" href="theme-szkola.css">
<link rel="stylesheet" href="theme-dzieci.css">
<link rel="stylesheet" href="tarcza.css">
<script>
  // Motyw from ☰ — three themes for the child; the saved choice is applied before first paint, so the cream one does not flash.
  // Same key as in the simulator (sim.html: KEY + "-theme") — its theme choice and the one in ☰ are one and the same.
  const MOTYWY = [['szkola-krem', 'Kremowy'], ['szkola-blekit', 'Błękitny'], ['szkola-noc', 'Nocny']];
  try { const m = localStorage.getItem('zegar-theme'); if (MOTYWY.some(([k]) => k === m)) document.documentElement.dataset.theme = m; } catch (e) {}
</script>
<script src="lib/tailwind.js"></script>
<script src="sim-bridge.js"></script>
<script src="dzwieki.js"></script>
<script src="tarcza.js"></script>
<script src="niebo.js"></script>
<script src="lekcja-polowy.js"></script>
<script src="lekcja-razem.js"></script>
<script src="lekcja-uplyw.js"></script>
<script src="cwiczenia.js"></script>
<script src="samouczki.js"></script>
<script src="druk.js"></script>
<style type="text/tailwindcss">
  @theme reference {
    --color-base-100: var(--color-base-100); --color-base-200: var(--color-base-200); --color-base-300: var(--color-base-300);
    --color-base-content: var(--color-base-content);
    --color-primary: var(--color-primary); --color-primary-content: var(--color-primary-content);
    --color-secondary: var(--color-secondary); --color-secondary-content: var(--color-secondary-content);
    --color-accent: var(--color-accent); --color-accent-content: var(--color-accent-content);
    --color-neutral: var(--color-neutral); --color-neutral-content: var(--color-neutral-content);
    --color-info: var(--color-info); --color-success: var(--color-success);
    --color-warning: var(--color-warning); --color-error: var(--color-error);
  }
</style>
<style>
  html, body { margin: 0; height: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--color-base-200);
    color: var(--color-base-content);
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
    /* hour / minute words in the colour of the hands of the chosen dial; dials without colours — dark */
    --tekst-g: var(--color-base-content); --tekst-m: var(--color-base-content);
    /* text sizes — one standard for the whole app; every label uses one of the three */
    --r-glowny: 32px; --r-przycisk: 22px; --r-drobny: 17px;
  }
  body[data-styl="szkolny"] { --tekst-g: var(--godz); --tekst-m: var(--min); }
  .g { color: var(--tekst-g); }
  .m { color: var(--tekst-m); }
  /* 100vh − 350px: header 56 + ▾ field 48 + card ~200 + gaps — on a short phone (360×640) the clock shrinks, nothing overlaps */
  #zegar-miejsce svg { width: min(88vw, 58vh, 100vh - 350px); height: auto; }
  /* ☀/☾ sky window on the dial above the 6 (niebo.js), with the time of day under it */
  .okno-ramka { fill: none; stroke: color-mix(in oklab, var(--color-base-content) 35%, transparent); stroke-width: 1; }
  .okno-pora { fill: var(--color-base-content); font: 700 10px system-ui, "Segoe UI", Roboto, sans-serif; }
  .bez-nieba .okno-niebo, .bez-nieba .okno-ramka { display: none; }   /* 🕓 „Animacja dnia i nocy na tarczy: Wyłączone" — the time of day stays */
  /* task under the clock in the Ustaw (set the hands) modes: what to set + „Sprawdź"; colours like the uncovered card,
     right / wrong shown briefly */
  .zadanie { width: min(100%, 24rem); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 12px 12px;
             text-align: center; background: var(--color-base-200); border: 1px solid var(--color-base-300);
             border-radius: var(--radius-box, 1rem); box-shadow: 0 4px 14px rgb(0 0 0 / .18); transition: background-color .2s, border-color .2s; }
  .zadanie > small { font-size: var(--r-drobny); font-weight: 600; color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }
  .zadanie > b { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: calc(2.5 * var(--r-przycisk));
               font-size: var(--r-przycisk); line-height: 1.25; }
  .zadanie > b.duze { font-size: var(--r-glowny); font-variant-numeric: tabular-nums; }
  .zadanie .btn { width: 100%; }
  .zadanie.dobrze { border-color: var(--color-success); background: color-mix(in oklab, var(--color-success) 22%, var(--color-base-200)); }
  .zadanie.zle { border-color: var(--color-error); background: color-mix(in oklab, var(--color-error) 18%, var(--color-base-200)); }
  /* Odczytaj in the same card: the answer row has the same height in every mode — the clock does not jump */
  .zadanie > b, .zadanie > .karta-odp, .wpisz { min-height: 110px; }   /* = height of the wheels (.kolo) — every card the same height */
  .zadanie .karta-odp.wlaczona .napis-blok { background: none; border: 0; box-shadow: none; padding: 0; min-height: 2.4em; }
  .zadanie .karta-odp .zaslona { box-shadow: none; }
  /* „Wpisz godzinę": two wheels (hour · minutes), ▲▼ next to each — by one */
  .wpisz { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: var(--r-glowny); font-weight: 700; }
  .wpisz-pole { display: flex; align-items: center; gap: 4px; }
  .kolo { position: relative; width: 2.4ch; height: 110px; overflow: hidden;   /* 5 numbers of 22 px each */
          touch-action: none;
          cursor: ns-resize; user-select: none; font-variant-numeric: tabular-nums;
          background: var(--color-base-100); border: 1px solid var(--color-base-300); border-radius: 10px; }
  .kolo-l { position: absolute; left: 0; right: 0; top: 50%; height: 22px; line-height: 22px; text-align: center; font-size: 15px; }
  .kolo-l.srodek { font-size: 27px; }
  .wpisz-pole.g .kolo { color: var(--tekst-g); }
  .wpisz-pole.m .kolo { color: var(--tekst-m); }
  .wpisz-pole > span { display: flex; flex-direction: column; gap: 2px; }
  .wpisz-pole.g > span { order: -1; }   /* hour ▲▼ first, minute ▲▼ last — only „:" between the wheels */
  .zadanie .wpisz-pole .btn { width: 31px; height: 22px; min-height: 0; padding: 0; font-size: 11px; }
  .zegar-rog { position: relative; }
  /* ▾ field with the task name above the clock: a tap opens the task list; after an answer it briefly shows
     „Dobrze!" (green) · „Popatrz, tak:" (red) */
  .pole-box { width: min(100%, 24rem); }
  .pole { width: 100%; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px;
          border-radius: 999px; cursor: pointer; background: var(--color-base-100); border: 2px solid var(--color-primary);
          color: var(--color-primary); font-size: var(--r-przycisk); font-weight: 700; white-space: nowrap;
          transition: background-color .2s, border-color .2s; }
  .pole svg { flex: none; }
  .pole.dobrze { background: var(--color-success); border-color: var(--color-success); color: var(--color-success-content); }
  .pole.zle { background: var(--color-error); border-color: var(--color-error); color: var(--color-error-content); }
  /* 🔊 in the corner of the task card — only for „Przeczytaj i ustaw" */
  .zadanie { position: relative; }
  .glos-rog { position: absolute; top: 6px; right: 6px; color: var(--color-primary); }
  .zadanie .glos-rog { width: var(--size); }   /* not 100% like Sprawdź — a round button in the corner */
  /* 🎲 at the bottom of the card, next to „Sprawdź" — it is needed very often, so it is always in the same place, also
     when „Sprawdź" is invisible */
  .zadanie-dol { display: flex; align-items: center; gap: 8px; width: 100%; }
  .zadanie .zadanie-dol > .btn { flex: 1; }
  .zadanie .zadanie-dol > .losuj { flex: none; width: 52px; height: 52px; padding: 0; }
  .napis { font-size: var(--r-glowny); font-weight: 700; text-align: center; margin: 0; line-height: 1.2; min-height: 2.4em; }
  .napis.cyfry { font-variant-numeric: tabular-nums; }   /* digits do not jump while dragging */
  /* the block has a fixed height (2 lines of text) — what is under it does not jump; the time of day is shown in the sky window */
  .napis-blok { font-size: var(--r-glowny); min-height: 2.4em; text-align: center; }
  .napis-blok .napis { min-height: 0; }
  /* time of day under the words on Start */
  .pora { margin: 0; min-height: 23px; font-size: var(--r-drobny); line-height: 23px; color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }
  /* „Zakryj godzinę": the „Która godzina?" card over the answer; covered = rotated by 180°, a tap flips it back and forth */
  .karta-odp { width: min(100%, 24rem); perspective: 900px; }
  .karta-odp .obrot { display: grid; transform-style: preserve-3d; transition: transform .45s ease; }
  .karta-odp .obrot > * { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .karta-odp .zaslona { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
                        transform: rotateY(180deg); border-radius: var(--radius-box, 1rem); cursor: pointer;
                        color: var(--color-primary-content); box-shadow: 0 4px 14px rgb(0 0 0 / .18);
                        background: repeating-linear-gradient(135deg, transparent 0 14px, rgb(255 255 255 / .12) 14px 28px), var(--color-primary); }
  .karta-odp .zaslona b { font-size: var(--r-glowny); line-height: 1.1; }
  .karta-odp .zaslona small { font-size: var(--r-drobny); font-weight: 600; letter-spacing: .04em; opacity: .85; }
  .karta-odp.wlaczona .zaslona { display: flex; }
  .karta-odp.zakryta .obrot { transform: rotateY(180deg); }
  .karta-odp.bez-animacji .obrot { transition: none; }
  /* the uncovered side is a card too — theme colours; the answer centred */
  .karta-odp.wlaczona .napis-blok { display: flex; flex-direction: column; align-items: center; justify-content: center;
                                    min-height: calc(2.4em + 16px); padding: 8px 12px;
                                    background: var(--color-base-200); border: 1px solid var(--color-base-300);
                                    border-radius: var(--radius-box, 1rem); box-shadow: 0 4px 14px rgb(0 0 0 / .18); cursor: pointer; }
  /* ⚙ clock settings: a drawer on the right */
  .ustaw-tytul { margin: 0; padding: 0 1rem .25rem; font-size: 18px; font-weight: 700; }
  .ustaw-glowa { display: flex; align-items: center; justify-content: space-between; padding-right: .5rem; }
  .ustaw-glowa .ustaw-tytul { padding-bottom: 0; }
  .ustaw-grupa { display: flex; flex-direction: column; gap: 6px; padding: .5rem 1rem; }
  .ustaw-grupa > span { font-size: 14px; font-weight: 600; color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }
  .ustaw-grupa .join { width: 100%; }
  .ustaw-grupa .btn { flex: 1; }
  .ustaw-grupa p { font-size: 13px; color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }
  .podglad { width: 44px; height: 44px; flex: none; pointer-events: none; }

  /* the Lekcje and Ćwiczenia lists — cards of equal height, a small clock with an example and a number in the colour of
     its section (like the icon on Start), name + one line */
  .lista-kafel { --kolor: var(--color-warning); --kolor-t: var(--color-warning-content);
                 flex: none; height: 88px; display: flex; align-items: center; gap: 14px; width: 100%; padding: 0 12px 0 14px;
                 text-align: left; cursor: pointer; background: var(--color-base-100); border: 0; border-radius: var(--radius-box, 1rem);
                 color: inherit; font: inherit; transition: transform .1s; }
  .lista-kafel.lekcje { --kolor: var(--color-success); --kolor-t: var(--color-success-content); }
  .lista-kafel:active { transform: scale(.97); }
  .lista-zeg { position: relative; flex: none; }
  .lista-zeg svg { display: block; width: 60px; height: 60px; pointer-events: none; }
  .lista-nr { position: absolute; top: -6px; left: -6px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
              background: var(--kolor); color: var(--kolor-t); font-size: 14px; font-weight: 800; }
  .lista-kafel .tekst { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .lista-kafel b { font-size: var(--r-przycisk); line-height: 1.15; white-space: nowrap; }
  .lista-kafel small { font-size: var(--r-drobny); color: color-mix(in oklab, var(--color-base-content) 62%, transparent);
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lista-kafel > svg { flex: none; color: var(--kolor); }

  /* Start: at the top 🏋 Trening (a clock to drag), at the bottom two small buttons in a row — an icon in the colour of
     its section, the name beside it */
  .start-gora { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .start-rzad { flex: none; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .start-rzad button { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 0; cursor: pointer;
                       background: var(--color-base-100); border: 0; border-radius: var(--radius-box, 1rem); color: inherit; font: inherit;
                       transition: transform .1s; }
  .start-rzad button:active, .start-pas:active { transform: scale(.97); }
  .start-rzad .ik, .start-pas .ik { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 10px; }
  .start-rzad .ik svg, .start-pas .ik svg { width: 22px; height: 22px; }
  /* info · warning: blue · amber in each of the three themes */
  .start-rzad .ik-karty { background: var(--color-success); color: var(--color-success-content); }
  .start-rzad .ik-zegar { background: var(--color-info); color: var(--color-info-content); }
  .start-rzad .ik-cwiczenia { background: var(--color-warning); color: var(--color-warning-content); }
  .start-rzad b, .start-pas b { font-size: var(--r-przycisk); line-height: 1.15; white-space: nowrap; }
  /* full-width „Karty pracy" bar above the clock */
  .start-pas { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer;
               background: var(--color-base-100); border: 0; border-radius: var(--radius-box, 1rem); color: inherit; font: inherit;
               transition: transform .1s; }
  .start-pas .ik-druk { background: var(--color-success); color: var(--color-success-content); }
  .start-pas > svg { margin-left: auto; opacity: .45; }
  /* ☰: Motyw at the bottom, separated by a rule */
  .menu li.oddzielnie { margin-top: .5rem; padding-top: .5rem; border-top: 1px solid var(--color-base-300); }
  /* ☰ Motyw: swatch = the theme's background + its primary colour (data-theme on the swatch gives it that theme's colours) */
  .probka { width: 22px; height: 22px; flex: none; border-radius: 50%;
            background: linear-gradient(135deg, var(--color-base-100) 50%, var(--color-primary) 50%);
            box-shadow: 0 0 0 1px color-mix(in oklab, var(--color-base-content) 35%, transparent); }

  /* lesson */
  #lekcja { justify-content: safe center; }
  #widok-lekcja .btn { font-size: var(--r-przycisk); }
  .wstep { margin: 0; text-align: center; font-size: var(--r-drobny); line-height: 1.35; max-width: 24rem; }
  .wstep.cichy { color: color-mix(in oklab, var(--color-base-content) 75%, transparent); }
  .karta-zegar svg { width: min(76vw, 40vh); height: auto; }
  .napis-karty { margin: 0; font-size: var(--r-glowny); font-weight: 700; line-height: 1.15; min-height: 1.8em;
                 display: flex; align-items: baseline; justify-content: center; gap: 0 .3em; flex-wrap: wrap; }
  .napis-karty small { font-size: var(--r-drobny); font-weight: 500; color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }
  .czas { display: inline-flex; flex-direction: column; align-items: center; }
  .uplyw { margin: 0; color: var(--uplyw); font-weight: 700; font-size: var(--r-przycisk); line-height: 1.3; height: 1.3em; flex: none; }
  .kafel { width: 100%; max-width: 22rem; background: var(--color-base-100); border-radius: var(--radius-box, 1rem);
           padding: .55rem 1rem; display: flex; flex-direction: column; align-items: center; gap: .1rem; font-size: var(--r-drobny); }
  .kafel b { font-size: var(--r-przycisk); }
  .kafel .rownanie { font-weight: 700; font-size: var(--r-przycisk); }
  .rada { width: 100%; max-width: 22rem; background: var(--color-base-100); border-radius: var(--radius-box, 1rem);
          padding: .5rem 1rem; text-align: center; font-size: var(--r-drobny); line-height: 1.35; }
  .znak { display: block; font-size: var(--r-drobny); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--color-primary); }

  /* lesson 4 „Po i za" (lekcja-polowy.js): right half „po", left half „za" (colours as in the level 3 tutorial); the half
     the minute hand is on lights up, and so does its label — at 12 and 6 only the label */
  .zegar .polowa-po { fill: var(--sam-po); fill-opacity: .12; transition: fill-opacity .15s; }
  .zegar .polowa-za { fill: var(--sam-za); fill-opacity: .12; transition: fill-opacity .15s; }
  .zegar .polowa-po.swieci, .zegar .polowa-za.swieci { fill-opacity: .36; }
  .polowy-gora { width: min(100%, 22rem); display: flex; justify-content: space-between; margin-bottom: -6px; }
  .polowy-gora span, .polowy-6 { font-size: var(--r-przycisk); font-weight: 700; opacity: .4; transition: opacity .15s; }
  .polowy-gora .za { color: var(--sam-za); }
  .polowy-gora .po { color: var(--sam-po); }
  .polowy-gora .swieci, .polowy-6.swieci { opacity: 1; }
  .polowy-6 { margin: -6px 0 0; }

  /* lesson 5 „Godzina i minuty" (lekcja-razem.js): the labels have a fixed height (glowny always 2 lines) — the clock
     above them does not jump when a label wraps or goes empty */
  .razem-glowny { font-size: var(--r-glowny); height: 2.3em; flex: none; align-content: center; text-align: center; }
  .razem-albo   { margin: 0; font-size: var(--r-drobny); line-height: 1.35; height: 1.35em; flex: none; color: color-mix(in oklab, var(--color-base-content) 70%, transparent); }
  .razem-slowa  { margin: 0; font-size: var(--r-przycisk); font-weight: 700; line-height: 1.3; height: 1.3em; flex: none; text-align: center; }
  .razem-cyfry  { margin: 0; font-size: var(--r-przycisk); font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: .35em; }
  .razem-cyfry small { font-size: var(--r-drobny); font-weight: 500; color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }

  /* lesson 6 „Upływ czasu" (lekcja-uplyw.js) */
  .uplyw-napis { font-variant-numeric: tabular-nums; }
  .przyklad { text-align: left; display: flex; flex-direction: column; align-items: center; gap: .45rem; padding: .6rem 1rem .8rem; }
  .przyklad p { margin: 0; align-self: stretch; }
  .przyklad .znak { align-self: stretch; text-align: center; }
  .przyklad-zegar svg { display: block; width: min(46vw, 26vh); height: auto; }
  .przyklad-odczyt, .przyklad .suma { text-align: center; }
  .przyklad .suma { font-weight: 700; color: var(--uplyw); }
  .sposob2 { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: .1em .45em;
             font-size: var(--r-przycisk); font-weight: 700; font-variant-numeric: tabular-nums; }
  .sposob2 small { font-size: var(--r-drobny); color: var(--uplyw); }

  /* exercises (cwiczenia.js): a box with the question above the clock, under it an area for 3 buttons (empty in Pokaż) —
     both of fixed height, so the clock stays in the same place. Words are long („Dziewiąta") — their 3 buttons are
     stacked one under another, hence the height of the area. */
  #widok-cw { justify-content: safe center; }
  .licznik { padding-right: .25rem; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;
             color: color-mix(in oklab, var(--color-base-content) 70%, transparent); }
  .cw-zegar svg { display: block; width: min(88vw, 50vh); height: auto; }
  .cw-pytanie { width: min(88vw, 50vh); height: 88px; box-sizing: border-box; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 2px; text-align: center;
                background: var(--color-base-100); border: 2px solid var(--color-base-300); border-radius: var(--radius-box, 1rem); }
  .cw-pytanie small { font-size: var(--r-drobny); line-height: 1.35; color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }
  .cw-pytanie b { font-size: var(--r-glowny); line-height: 1.2; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cw-cel { height: 168px; display: flex; align-items: flex-start; justify-content: center; }
  .cw-wybor { display: flex; gap: 12px; }
  .cw-wybor .btn { width: 6rem; padding-inline: 0; font-size: var(--r-przycisk); font-variant-numeric: tabular-nums; }
  .cw-wybor .btn:not(.btn-success, .btn-error) { --btn-color: var(--color-base-100); }
  .slowa .cw-wybor, .zdania .cw-wybor { flex-direction: column; gap: 10px; }
  .slowa .cw-wybor .btn { width: 14rem; }
  /* level 4: whole sentences („Piętnaście po jedenastej") — 22 instead of 32 in the box, buttons almost full width */
  .zdania .cw-wybor .btn { width: 18rem; }
  .cw-pytanie.zdania small + b { font-size: var(--r-przycisk); }   /* only the sentence in Pokaż; „Która godzina?" stays 32 */
  /* level 6: „Dwadzieścia pięć po jedenastej" does not fit in 18rem — two-line buttons, all three equal, and a taller
     area (3 × 62 + 2 × 8) so the clock does not jump during a round */
  .cw-cel.dwa-wiersze { height: 202px; }
  .dwa-wiersze .cw-wybor { gap: 8px; }
  .dwa-wiersze .cw-wybor .btn { height: 62px; line-height: 1.2; }
  /* level 9: the bridge from the textbook, 13:50 → 14:00 → 14:10 — the jumps above the arrows, the total underneath;
     3 buttons below */
  .cw-cel.most { flex-direction: column; align-items: center; gap: 10px; }
  .cw-most { width: min(88vw, 50vh); display: grid; grid-template-columns: auto 1fr auto 1fr auto; align-items: center; row-gap: 4px; }
  .cw-most .czas { grid-row: 2; padding: 2px 8px; font-size: var(--r-przycisk); font-weight: 700; font-variant-numeric: tabular-nums;
                   background: var(--color-base-100); border: 2px solid var(--color-base-300); border-radius: .5rem; }
  .cw-most .strz { grid-row: 2; text-align: center; font-size: var(--r-przycisk);
                   color: color-mix(in oklab, var(--color-base-content) 50%, transparent); }
  .cw-most .skok, .cw-most .razem { font-size: var(--r-drobny); line-height: 1.5; text-align: center; white-space: nowrap; min-height: 1.5em; }
  .cw-most .s1 { grid-row: 1; grid-column: 1 / 4; }
  .cw-most .s2 { grid-row: 1; grid-column: 3 / 6; }
  .cw-most .razem { grid-row: 3; grid-column: 1 / -1; }
  .cw-most .teraz b { display: inline-block; min-width: 1.6em; border-radius: .4rem;
                      background: var(--color-warning); color: var(--color-warning-content); }
  .cw-most .zrobione { color: var(--color-success); font-weight: 700; }
  /* level 10: Ustaw — both hands separately, then „Sprawdź" (no click sound from dzwieki.js — it has its own right / wrong) */
  .cw-sprawdz { width: 14rem; font-size: var(--r-przycisk); }
  /* bonus: „Minęły 2 godziny i 25 minut" does not fit at 32 — 22, at most 2 lines (17 + 2 × 26 < 88) */
  .cw-pytanie.minelo b { font-size: var(--r-przycisk); }
  .cw-kolko { fill-opacity: .45; }
  .cw-kolko.dobrze { fill: var(--color-success); }
  .cw-kolko.zle { fill: var(--color-error); }
  .cw-wynik { margin: 0; font-size: var(--r-glowny); font-weight: 700; }
  .cw-punkty { margin: 0 0 8px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
  .cw-punkty b { font-size: var(--r-glowny); font-variant-numeric: tabular-nums; }
  .cw-punkty small { font-size: var(--r-drobny); color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }
  .cw-koniec { width: 100%; max-width: 20rem; display: flex; flex-direction: column; gap: 10px; }
  .cw-koniec .btn { font-size: var(--r-przycisk); }
  .cw-koniec .btn:not(.btn-primary) { --btn-color: var(--color-base-100); }
  /* tutorial (samouczki.js): the whole help sits in one frame, so it is clear that this is not the ordinary clock —
     background and outline in the theme colour, at the top a badge like „Dobra rada" in the lessons. Inside: a sentence
     at 22 (32 does not fit; room for 2 lines — the clock does not jump), a clock a bit smaller than in a round, under it
     a big label at 32, a small description at 17 and „Dalej" / „Wróć". The hand being talked about blinks; the minute
     labels (05 … 55) are hidden and light up during counting. */
  .sam-ramka { width: min(100%, 24rem); box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
               gap: 8px; padding: 8px 12px 14px; border-radius: var(--radius-box, 1rem);
               background: color-mix(in oklab, var(--color-primary) 12%, var(--color-base-100));
               border: 2px solid color-mix(in oklab, var(--color-primary) 55%, var(--color-base-100)); }
  .sam-gora { height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
              text-align: center; }
  .sam-znak { font-size: var(--r-drobny); font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
              line-height: 1.2; color: var(--color-primary); }
  .sam-gora p { margin: 0; font-size: var(--r-przycisk); line-height: 1.2; }
  .sam-zegar svg { display: block; width: min(80vw, 44vh); height: auto; }
  .sam-pod { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sam-duzy { margin: 0; font-size: var(--r-glowny); font-weight: 700; line-height: 1.2; min-height: 1.2em; font-variant-numeric: tabular-nums; }
  .sam-maly { margin: 0; font-size: var(--r-drobny); line-height: 1.35; min-height: 1.35em; font-variant-numeric: tabular-nums;
              color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }
  .sam-dalej { width: 12rem; margin-top: 4px; font-size: var(--r-przycisk); }
  .sam-ukryty { visibility: hidden; }
  /* 🏋 Trening: a tutorial step without „💡 Jak to działa?" and without „Dalej"; the sentence in 1–2 lines */
  .trening { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  .trening .sam-znak, .trening .sam-dalej { display: none; }
  .trening .sam-ramka { background: none; border: 0; }
  /* switches under the labels: „Po i za" · „Upływ czasu" — turning one on turns the other off (samTrening) */
  .sam-przelaczniki { display: flex; justify-content: center; gap: 20px; margin-top: 6px; }
  .sam-przelaczniki label { display: flex; align-items: center; gap: 8px; font-size: var(--r-drobny); cursor: pointer; }
  .trening .sam-gora { height: 56px; }
  /* Start: the clock shrinks on a short phone (360×640) — the sentences, the switches and Trening · Ćwiczenia fit;
     the 474 px include 64 px for the „Karty pracy" bar above the clock */
  .trening .sam-zegar svg { width: min(80vw, 44vh, 100vh - 474px); }
  /* „Która godzina?": the number of the hour the short hand has passed is enlarged (samTrening in samouczki.js) */
  .trening .sam-teraz { fill: #ff8c1a; }   /* while enlarged — red-orange */
  /* ×1.45 by a bigger font, not scale(): the number is centred on its point (text-anchor + dominant-baseline), so it stays
     in place; scale with transform-box: fill-box slid downwards on a tablet */
  .trening .s-cyfra.sam-teraz { font-size: 26px; }  .trening .s-cyfra.rz.sam-teraz { font-size: 20px; }
  .trening .m-cyfra.sam-teraz { font-size: 32px; }  .trening .m-cyfra.rz.sam-teraz { font-size: 23px; }
  .trening .k-cyfra.sam-teraz { font-size: 28px; }  .trening .k-cyfra.rz.sam-teraz { font-size: 22px; }
  .trening .s-cyfra, .trening .m-cyfra, .trening .k-cyfra { transition: font-size .2s, fill .2s; }
  /* „Dwadzieścia pięć po jedenastej wieczorem" can take 2 lines — always room for 2, so nothing below it jumps */
  .trening .sam-maly { min-height: 2.7em; text-align: center; }
  /* „Upływ": „1 godz." · „20 min" at the tip of the minute hand, outside the dial — at 3 and 9 it sticks out a little
     past the clock (samTrening; .zegar has overflow: visible) */
  .sam-uplyw { fill: var(--uplyw); font: 700 9px system-ui, "Segoe UI", Roboto, sans-serif; text-anchor: middle;
               dominant-baseline: central; }
  .sam-swieci { animation: sam-miga 1s ease-in-out infinite; }
  @keyframes sam-miga { 50% { opacity: .2; } }
  .sam-palec { font-size: 30px; text-anchor: middle; dominant-baseline: hanging; }
  /* level 3: right half of the dial „po", left half „za" — the words po / za use these colours too */
  :root { --sam-po: #e39a00; --sam-za: #8b55cc; }
  .sam-po { color: var(--sam-po); }
  .sam-za { color: var(--sam-za); }
  .zegar .sam-pol-po { fill: var(--sam-po); fill-opacity: .2; }
  .zegar .sam-pol-za { fill: var(--sam-za); fill-opacity: .16; }
  /* level 4: the dial cut into 4 pieces of 15 minutes (the pieces are .sektor, like elapsed time) */
  .zegar .sam-ciecie { fill: none; stroke: color-mix(in oklab, var(--color-base-content) 35%, transparent); stroke-width: 1.5; stroke-linecap: round; }
  /* each piece has its own green, from light (12 → 3) to dark (9 → 12) */
  .zegar .sam-cwiartka.c0 { fill-opacity: .16; } .zegar .sam-cwiartka.c1 { fill-opacity: .3; }
  .zegar .sam-cwiartka.c2 { fill-opacity: .44; } .zegar .sam-cwiartka.c3 { fill-opacity: .58; }
  /* level 6: the big label is a sentence of up to 2 lines („Dwadzieścia pięć po szóstej") — always room for 2, the clock
     does not jump; the sentence is in a single <span> (samZdanie), so flex only centres it */
  .sam-dwa .sam-duzy { min-height: 2.4em; display: flex; align-items: center; justify-content: center; text-align: center; }

  /* Karty pracy (druk.js): above the sheet a ▾ field with the task type (as in Trening) · a smaller ▾ with how many
     clocks + „Odpowiedzi" · „Zapisz" (APK only) + „Wydrukuj" + 🎲, below it the preview of the A4 sheet */
  .druk-ster { width: min(100%, 30rem); flex: none; display: flex; flex-direction: column; gap: 10px; }
  .druk-ster .pole-box { width: 100%; }
  .druk-srodek { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .druk-ster .druk-ile { width: auto; }
  .druk-ile .pole { font-size: 18px; }
  .druk-odp { display: flex; align-items: center; gap: 8px; font-size: var(--r-drobny); cursor: pointer; }
  .druk-dol { display: flex; align-items: center; gap: 8px; }
  .druk-dol .btn { height: 52px; font-size: var(--r-przycisk); }
  .druk-dol .btn:first-child { flex: 1; gap: 10px; }
  .druk-dol .druk-losuj { flex: none; width: 52px; padding: 0; }
  .druk-dol.dwa .btn:not(.druk-losuj) { flex: 1; gap: 6px; padding-inline: 10px; font-size: 18px; }   /* „Zapisz" + „Wydrukuj" + 🎲 */
  .druk-dol.dwa .btn:not(.druk-losuj) svg { width: 22px; height: 22px; }
  .druk-kartki { width: min(100%, 30rem); flex: none; display: flex; flex-direction: column; gap: 12px; }   /* pages one under another */
  .druk-podglad { aspect-ratio: 210 / 297; container-type: inline-size; background: #fff; box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
  /* sheet: sizes in --mm (on screen 1/210 of the preview width, in print 1 mm); fixed colours — white also in the Nocny theme */
  .arkusz { --mm: calc(100cqw / 210); --color-base-100: #fff; --color-base-300: #bbb; --color-base-content: #1a1a1a;
            --tekst-g: #1a1a1a; --tekst-m: #1a1a1a;
            width: 100%; height: 100%; box-sizing: border-box; padding: calc(var(--mm) * 12) calc(var(--mm) * 12) calc(var(--mm) * 10);
            display: flex; flex-direction: column; gap: calc(var(--mm) * 4); background: #fff; color: #1a1a1a;
            print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  body[data-styl="szkolny"] .arkusz { --tekst-g: var(--godz); --tekst-m: var(--min); }
  .arkusz .zegar { pointer-events: none; touch-action: auto; cursor: default; }   /* a finger on the clock scrolls the page */
  .arkusz h1 { margin: 0; font-size: calc(var(--mm) * 7); font-weight: 700; line-height: 1.2; }
  .ark-siatka { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--kol), 1fr); grid-auto-rows: 1fr; }
  .ark-zad { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--mm) * 2); }
  .ark-zad svg { width: calc(var(--mm) * var(--zeg)); height: auto; }
  .ark-zad b { font-size: calc(var(--mm) * var(--fs)); line-height: 1; font-variant-numeric: tabular-nums; }
  .ark-nr { position: absolute; top: calc(var(--mm) * 1); left: calc(var(--mm) * 2); font-size: calc(var(--mm) * 5); color: #777; }
  .ile-4 { --kol: 2; --zeg: 80; --fs: 11; }
  .ile-6 { --kol: 2; --zeg: 62; --fs: 9; }
  .ile-9 { --kol: 3; --zeg: 52; --fs: 8; }
  .ile-12 { --kol: 3; --zeg: 42; --fs: 7; }
  /* „Tak czy nie?": TAK · NIE boxes under the time, so the clocks are a bit smaller; „Upływ czasu": „za 20 minut" above
     the boxes; „Zapisz słowami": two lines to write on */
  .typ-czy.ile-4, .typ-uplyw.ile-4, .typ-pisz.ile-4 { --zeg: 76; }  .typ-czy.ile-6, .typ-uplyw.ile-6, .typ-pisz.ile-6 { --zeg: 58; }
  .typ-czy.ile-9, .typ-uplyw.ile-9, .typ-pisz.ile-9 { --zeg: 50; }  .typ-czy.ile-12, .typ-uplyw.ile-12, .typ-pisz.ile-12 { --zeg: 40; }
  .ark-za { font-size: calc(var(--mm) * var(--fs) * .7); font-weight: 700; line-height: 1; }
  .ark-tn { display: flex; gap: calc(var(--mm) * var(--fs) * .7); font-size: calc(var(--mm) * var(--fs) * .6); line-height: 1; }
  .ark-tn span { display: flex; align-items: center; gap: .35em; }
  .ark-tn i { width: 1em; height: 1em; box-sizing: border-box; border: .09em solid #1a1a1a; border-radius: .15em; }
  /* „Która godzina?", „Po południu" and „Upływ czasu": instead of the time, two empty boxes to fill in — hour : minutes */
  .ark-pole { display: flex; align-items: center; gap: calc(var(--mm) * var(--fs) * .25); }
  .ark-pole i { width: calc(var(--mm) * var(--fs) * 2); height: calc(var(--mm) * var(--fs) * 1.5); box-sizing: border-box;
                border: calc(var(--mm) * .4) solid #1a1a1a; border-radius: calc(var(--mm) * 1.5); }
  /* „Przeczytaj i narysuj": the time in words — smaller letters, always room for 2 lines („Dwadzieścia pięć po jedenastej") */
  .typ-slowa.ile-4 { --fs: 8; }  .typ-slowa.ile-6 { --fs: 7; }  .typ-slowa.ile-9 { --fs: 6; }  .typ-slowa.ile-12 { --fs: 5; }
  .typ-slowa .ark-zad b { min-height: 2.4em; line-height: 1.2; padding: 0 calc(var(--mm) * 3); text-align: center; text-wrap: balance; }
  /* „Zapisz słowami": the child writes the text — two lines to write on under the clock; --lin is the line spacing */
  .typ-pisz.ile-4 { --lin: 11; }  .typ-pisz.ile-6 { --lin: 10; }  .typ-pisz.ile-9 { --lin: 9; }  .typ-pisz.ile-12 { --lin: 8; }
  .ark-linie { width: calc(100% - var(--mm) * 8); }
  .ark-linie i { display: block; height: calc(var(--mm) * var(--lin)); border-bottom: calc(var(--mm) * .3) solid #1a1a1a; }
  /* answers: a separate, second page — at the top, upside down;
     --okol: how many per row — 12 clocks go in two rows of 6 */
  .ile-4 { --okol: 4; }  .ile-6 { --okol: 6; }  .ile-9 { --okol: 9; }  .ile-12 { --okol: 6; }
  .ark-odp { flex: none; display: grid; grid-template-columns: repeat(var(--okol), calc(var(--mm) * 18)); justify-content: center;
             gap: calc(var(--mm) * 5) calc(var(--mm) * 2.5); transform: rotate(180deg); }
  .ark-odp > div { display: flex; flex-direction: column; align-items: center; gap: calc(var(--mm) * 1);
                   font-size: calc(var(--mm) * 4); line-height: 1; color: #555; }
  .ark-odp svg { width: 100%; height: auto; }
  /* „Tak czy nie?", „Która godzina?", „Po południu" and „Upływ czasu": the answers are text, „1 TAK" · „1. 08:35" —
     columns as wide as the text; 9 times in one row do not fit on the sheet → 5 + 4 */
  .typ-czy .ark-odp, .typ-godzina .ark-odp, .typ-popo .ark-odp, .typ-uplyw .ark-odp, .typ-pisz .ark-odp {
    grid-template-columns: repeat(var(--okol), auto); column-gap: calc(var(--mm) * 6); }
  .typ-godzina.ile-9, .typ-popo.ile-9, .typ-uplyw.ile-9 { --okol: 5; }
  /* „Zapisz słowami": the answers are sentences („1. Za pięć siódma") — at most 3 per row */
  .typ-pisz.ile-4 { --okol: 2; }  .typ-pisz.ile-6, .typ-pisz.ile-9, .typ-pisz.ile-12 { --okol: 3; }
  /* print: only the sheet pages (copies in #do-druku), and only from the Karty pracy screen — elsewhere Ctrl+P prints as usual */
  #do-druku { display: none; }
  @media print {
    @page { size: A4; margin: 0; }
    html:has(body.ekran-druk), body.ekran-druk { height: auto !important; background: #fff !important; }
    body.ekran-druk > :not(#do-druku) { display: none !important; }
    body.ekran-druk > #do-druku { display: block; }
    #do-druku .arkusz { --mm: 1mm; width: 210mm; height: 296mm; }
    #do-druku .arkusz + .arkusz { break-before: page; }
  }
</style>
</head>
<body>

<div class="drawer h-full">
  <input id="menu" type="checkbox" class="drawer-toggle">

  <div class="drawer-content h-full min-h-0 flex flex-col"><!-- min-h-0: the drawer's grid row does not grow with a long lesson -->
    <header class="flex items-center gap-1 px-2 h-14 shrink-0">
      <label for="menu" id="przycisk-menu" class="btn btn-ghost btn-square" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </label>
      <span class="text-lg font-bold mr-auto" id="tytul">Start</span>
      <!-- 🕓 clock appearance: before ⚙, only on screens with a clock -->
      <label for="wyglad" id="przycisk-wygladu" class="btn btn-ghost btn-square" aria-label="Wygląd zegara" hidden>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      </label>
      <label for="ustawienia" id="przycisk-ustawien" class="btn btn-ghost btn-square" aria-label="Ustawienia" hidden>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </label>
      <span class="licznik" id="licznik" hidden></span>
      <!-- 💡 the level's tutorial once more (samouczki.js) — only in a round of a level that has one -->
      <button id="przycisk-pomoc" class="btn btn-ghost btn-square" aria-label="Jak to działa?" hidden>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/></svg>
      </button>
      <!-- 🏠: one tap to Start, from any screen; right edge, after ⚙ / the counter; hidden on Start -->
      <button id="przycisk-start" class="btn btn-ghost btn-square" aria-label="Start" hidden>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
    </header>

    <!-- Start: the app opens here — a clock to drag, under it Trening · Ćwiczenia -->
    <main id="widok-start" class="flex-1 min-h-0 overflow-y-auto flex flex-col gap-3 px-4 pt-2 pb-4" hidden></main>

    <main id="widok-lista" class="flex-1 min-h-0 overflow-y-auto flex flex-col gap-3 px-4 pt-2 pb-4" hidden></main>

    <main id="widok-lekcja" class="flex-1 min-h-0 flex flex-col px-4 pb-4" hidden>
      <div id="lekcja" class="flex-1 min-h-0 overflow-y-auto flex flex-col items-center gap-3 py-2"></div>
      <button id="dalej" class="btn btn-primary w-full shrink-0 mt-2"></button>
    </main>

    <!-- ★ Ćwiczenia: the level list, a level round -->
    <main id="widok-cw-lista" class="flex-1 min-h-0 overflow-y-auto flex flex-col gap-3 px-4 pt-2 pb-4" hidden></main>

<!-- copy of the sheet from Karty pracy — the only thing visible in print (druk.js) -->
<div id="do-druku"></div>

<script>
"use strict";
const NS = 'http://www.w3.org/2000/svg';
const napisEl = document.getElementById('napis');
const menuEl = document.getElementById('menu');

// ---- how times are said ----
// index 0 = dwunasta
const GODZ    = ['dwunasta','pierwsza','druga','trzecia','czwarta','piąta','szósta','siódma','ósma','dziewiąta','dziesiąta','jedenasta'];
const GODZ_EJ = ['dwunastej','pierwszej','drugiej','trzeciej','czwartej','piątej','szóstej','siódmej','ósmej','dziewiątej','dziesiątej','jedenastej'];
const PO = { 5: 'pięć po', 10: 'dziesięć po', 15: 'kwadrans po', 20: 'dwadzieścia po', 25: 'dwadzieścia pięć po' };
const ZA = { 35: 'za dwadzieścia pięć', 40: 'za dwadzieścia', 45: 'za kwadrans', 50: 'za dziesięć', 55: 'za pięć' };

// every minute (krok 1): „siedem po ósmej", „za dwadzieścia dwie dziewiąta" — „minuta" is feminine (dwie, not dwa)
const JEDN = ['', '', 'dwie', 'trzy', 'cztery', 'pięć', 'sześć', 'siedem', 'osiem', 'dziewięć', 'dziesięć',
              'jedenaście', 'dwanaście', 'trzynaście', 'czternaście', 'piętnaście', 'szesnaście', 'siedemnaście',
              'osiemnaście', 'dziewiętnaście'];
const ileMinut = n => n < 20 ? JEDN[n] : 'dwadzieścia' + (n > 20 ? ' ' + (n === 21 ? 'jeden' : JEDN[n - 20]) : '');

// tm: whole minutes since 12:00 → [minute part, hour part]
function napis(tm) {
  const h = Math.floor(tm / 60) % 12, m = tm % 60, nast = (h + 1) % 12;
  if (m === 0)  return ['', GODZ[h]];
  if (m < 30)   return [PO[m] || (m === 1 ? 'minuta po' : ileMinut(m) + ' po'), GODZ_EJ[h]];
  if (m === 30) return ['wpół do', GODZ_EJ[nast]];
  return [ZA[m] || (m === 59 ? 'za minutę' : 'za ' + ileMinut(60 - m)), GODZ[nast]];
}
// tm: minutes since midnight (0…1439) → 24 h, as in the textbook and on a phone: 0:40, 8:20, 20:20
const cyfrowo = tm => `${Math.floor(tm / 60)}:${String(tm % 60).padStart(2, '0')}`;
// time of day under the words: 5–11 rano · 12–17 po południu · 18–22 wieczorem · 23–4 w nocy
function pora(tm) {
  const g = Math.floor(tm / 60);
  return g >= 5 && g < 12 ? 'rano' : g >= 12 && g < 18 ? 'po południu' : g >= 18 && g < 23 ? 'wieczorem' : 'w nocy';
}

const duza = s => s.charAt(0).toUpperCase() + s.slice(1);
const slowami = tm => duza(napis(tm).filter(Boolean).join(' ')) + ' ' + pora(tm);
// the time on the dial snapped to the step, in minutes since midnight — the dial counts 12 h, popo holds the half of the day
const tDoby = () => Math.round((t + (popo ? 720 : 0)) / krok) * krok % 1440;

let ostatni = -1;
function pokazNapis() {
  const tk = tDoby();
  if (tk === ostatni) return;
  ostatni = tk;
  napisEl.textContent = '';
  napisEl.classList.toggle('cyfry', zapis === 'cyfry');
  if (zapis === 'cyfry') {
    const [gg, mm] = cyfrowo(tk).split(':');
    napisEl.innerHTML = `<span class="g">${gg}</span>:<span class="m">${mm}</span>`;
    return;
  }
  const [m, g] = napis(tk);
  const sg = document.createElement('span'); sg.className = 'g';
  if (m) {
    const sm = document.createElement('span'); sm.className = 'm'; sm.textContent = duza(m);
    sg.textContent = g;
    napisEl.append(sm, ' ', sg);
  } else {
    sg.textContent = duza(g);
    napisEl.append(sg);
  }
}

// ---- voice: the phone speaks Polish (also for future tasks) ----
// the APK's WebView has no speechSynthesis — there the phone's own TTS goes through the plugin, with the same cancel()
const tts = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.TextToSpeech;
const glos = tts ? { cancel: () => tts.stop() } : 'speechSynthesis' in window ? window.speechSynthesis : null;
if (glos && !tts) glos.getVoices();          // Chrome loads the voices only after the first request
function mow(tekst) {
  if (!glos) return;
  glos.cancel();                             // a new press interrupts the previous one
  if (tts) { tts.speak({ text: tekst, lang: 'pl-PL' }).catch(e => log(`mow: ${e.message}`)); return; }
  const u = new SpeechSynthesisUtterance(tekst);
  u.lang = 'pl-PL';
  const pl = glos.getVoices().find(v => /^pl/i.test(v.lang));
  if (pl) u.voice = pl;
  glos.speak(u);
}

// 🔊 in the corner of the task card: always in words (8:20 read from digits sounds wrong); visible only for „Przeczytaj i ustaw" (pokazTryb)
const powiedzEl = document.getElementById('powiedz');
powiedzEl.onclick = () => {
  const tekst = tryb === 'odczytaj' ? slowami(tDoby()) : tekstZadania();   // in the Ustaw modes — the task
  mow(tekst);
  log(`powiedz: ${tekst}`);
};

// ⚙ „Głos" — APK only: opens the phone's text-to-speech settings, where the Polish voice is installed
const ustawieniaTel = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.NativeSettings;
if (ustawieniaTel) {
  document.getElementById('g-glos').hidden = false;
  document.getElementById('u-glos').onclick = () => ustawieniaTel.openAndroid({ option: 'text_to_speech' });
}

// ---- clock appearance ----
const STYLE = [['szkolny', 'Szkolny'], ['minimalny', 'Minimalny'], ['klasyczny', 'Klasyczny']];
const CYFRY = [['zwykle', 'Zwykłe'], ['minuty', 'Z minutami'], ['brak', 'Bez cyfr'], ['cztery', 'Tylko 12, 3, 6, 9'], ['rzymskie', 'Rzymskie']];
// „Cyfry po południu" in ⚙: with „24", after 12:00 the dial switches to 13 … 23 by itself. Only for the Szkolny dial with
// Zwykłe / Z minutami digits — otherwise the group is not shown in ⚙.
const PO13 = [['nie', '12'], ['tak', '24'], ['oba', 'Oba']];   // Oba — small 13 … 24 on the inside
const po13Tu = () => styl === 'szkolny' && (cyfry === 'zwykle' || cyfry === 'minuty');
const na13 = () => po13 === 'tak' && po13Tu();
const oba = () => po13 === 'oba' && po13Tu();
const RAMA = { minimalny: '3' };
const PODGLAD_T = 10 * 60 + 10;    // 10:10 in the menu previews

function zapisane(klucz, lista) {
  let v = null; try { v = localStorage.getItem(klucz); } catch (e) {}
  return lista.some(([k]) => k === v) ? v : lista[0][0];
}
let styl = zapisane('zegar-styl', STYLE);
let cyfry = zapisane('zegar-cyfry', CYFRY);
let po13 = zapisane('zegar-po13', PO13);
try {   // migrates the old saved digits 'od13' → Zwykłe + „Cyfry po południu": „24"
  if (localStorage.getItem('zegar-cyfry') === 'od13') { po13 = 'tak'; localStorage.setItem('zegar-po13', po13); localStorage.setItem('zegar-cyfry', cyfry); }
} catch (e) {}

// switches in the ⚙ settings (widok 'zegar')
const KROKI = [['5', 'Co 5 min'], ['1', 'Co 1 min']];
const ZAPISY = [['slowa', 'Słowami'], ['cyfry', 'Cyframi']];
const PORY = [['przed', '☀ Przed południem'], ['po', '☾ Po południu']];
let krok = +zapisane('zegar-krok', KROKI);
let zapis = zapisane('zegar-zapis', ZAPISY);

// „Zakryj godzinę": the answer is under the „Która godzina?" card; a tap flips the card back and forth,
// moving a hand covers it again
const ZAKRYCIA = [['nie', 'Nie'], ['tak', 'Tak']];
// „Dźwięki": click, hand tick, right / wrong — dzwieki.js remembers the choice itself
const DZWIEKI = [['tak', 'Włączone'], ['nie', 'Wyłączone']];
// „Animacja dnia i nocy na tarczy" in 🕓: Wyłączone = no sky window on the dial; the time of day under it stays
const DZIEN_NOC = [['tak', 'Włączone'], ['nie', 'Wyłączone']];
let dzienNoc = zapisane('zegar-niebo', DZIEN_NOC);
let zakryj = 'nie';   // ⚙ has no „Zakryj godzinę" switch — the card is never covered
let odkryta = false;
const kartaEl = document.getElementById('karta-odp');
function pokazKarte() {
  const odczyt = tryb === 'odczytaj', wpisuje = wpisz === 'tak';   // in the Ustaw modes the task takes the place of the card
  kartaEl.hidden = wpisuje;
  kartaEl.classList.toggle('wlaczona', zakryj === 'tak');
  kartaEl.classList.toggle('zakryta', zakryj === 'tak' && !odkryta);
  document.getElementById('wpisz').hidden = !wpisuje;
  document.getElementById('sprawdz-wpis').style.visibility = wpisuje ? '' : 'hidden';
  // covered time = 🔊 is silent too: the button is greyed out, speech in progress is cut off; the same while entering the time
  const cisza = odczyt && (wpisuje || zakryj === 'tak' && !odkryta);
  powiedzEl.disabled = cisza;
  if (cisza && glos) glos.cancel();
}
// new time = new puzzle: covers at once, without the flip — so that the new answer does not flash
function zakryjZnowu() {
  if (zakryj !== 'tak' || !odkryta) return;
  odkryta = false;
  kartaEl.classList.add('bez-animacji');
  pokazKarte();
  void kartaEl.offsetWidth;                  // first without the transition, then the animation comes back
  kartaEl.classList.remove('bez-animacji');
}
kartaEl.onclick = () => {
  if (zakryj !== 'tak') return;
  odkryta = !odkryta;
  pokazKarte();
  Dzwiek.obrot();
  log(odkryta ? `odkryto: ${zapis === 'cyfry' ? cyfrowo(tDoby()) : slowami(tDoby())}` : 'zakryto');
};

// „Która godzina?" in Trening — always the wheels for entering the time (one screen, no switches)
const wpisz = 'tak';

// start: now, snapped to the step; the half of the day follows from the hour (it is not saved)
const teraz = new Date();
const tStart = Math.round((teraz.getHours() * 60 + teraz.getMinutes()) / krok) * krok % 1440;
let t = tStart % 720;          // minutes since 12:00
let popo = tStart >= 720;      // afternoon half (12:00–23:59)

// the hand crossed 12 (t jumps 719 ↔ 0) → the other half of the day
function nowyCzas(nt) {
  const przez12 = Math.abs(nt - t) > 360;
  t = nt;
  if (przez12 && tryb === 'odczytaj') { popo = !popo; zegar.popo(popo); zbudujPrzelaczniki(); }   // in the Ustaw modes the time of day belongs to the task
}

function noweSvg(cls) { const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', cls); return s; }
function h(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

// ☀/☾ sky window on the dial above the 6 (niebo.js): while dragging it follows the finger, without snapping to the step;
// on 🎲 and ⚙ it moves smoothly, together with the hands. Under it the time of day — always, also with digits and on a
// covered card (the child does not read 24 h yet, and 5:45 and 17:45 look the same on the dial). It sits above the dial
// background, under the digits and the hands; with minute digits it shrinks together with the dial.
let niebo = null;
const tCiagly = () => t + (popo ? 720 : 0);
function okienkoNieba(svg) {
  // 74 wide: the window and the time of day do not cover VIII, VII, V on the Klasyczny dial
  // ⚙ Oba — the window sits 4 higher, so that the time of day does not run into the small 17 · 18 · 19
  const x = 63, y = oba() ? 103 : 107, w = 74, hh = w * 90 / 320;   // sky proportions from niebo.js (320 × 90)
  const g = document.createElementNS(NS, 'g');
  g.innerHTML = `<clipPath id="okno-nieba"><rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="5"/></clipPath>` +
    `<g class="okno-niebo" clip-path="url(#okno-nieba)"><svg x="${x}" y="${y}" width="${w}" height="${hh}"></svg></g>` +
    `<rect class="okno-ramka" x="${x}" y="${y}" width="${w}" height="${hh}" rx="5"/>` +
    `<text class="okno-pora" x="100" y="${y + hh + 9}" text-anchor="middle"></text>`;
  svg.querySelector('.s-tlo, .m-tlo, .k-tlo').after(g);
  const napis = g.querySelector('text');
  return Niebo(g.querySelector('svg'), tm => { napis.textContent = pora(tm); });
}

// with „Cyfry po południu": „24" the dial follows ☀/☾ by itself
let zegar = null;
function zbudujZegar() {
  const miejsce = document.getElementById('zegar-miejsce');
  miejsce.textContent = '';
  const svg = noweSvg('duzy');
  miejsce.appendChild(svg);
  zegar = Zegar(svg, {
    styl, cyfry, rama: RAMA[styl] || '', t, krok, popo, po13: na13(), oba: oba(),
    zmiana(nt, puszczone) {
      nowyCzas(nt);
      if (tryb === 'odczytaj') niebo.ustaw(tCiagly());   // in the Ustaw modes the sky shows the task's time of day
      if (!puszczone) zakryjZnowu();
      pokazNapis();
      if (puszczone) { const tk = tDoby(); log(`ustawiono ${cyfrowo(tk)} — ${slowami(tk)}`); }
    }
  });
  niebo = okienkoNieba(svg);
  niebo.ustaw(nieboCel());
}

// 🎲 random time: the whole day, in steps from ⚙, never the same as now; ☀/☾ follows by itself.
// The hands travel there in ~0.5 s, the words change when they arrive; a covered card covers at once — a new puzzle.
document.querySelectorAll('.losuj').forEach(b => b.onclick = () => {
  rzutKostki();
  nastepne();                                          // 🎲 — another task (with „Wszystko na zmianę" — of another type too)
});
// the roll: one turn with a hop, 0.5 s — as long as the hands travel; halfway through the turn a new face —
// 1…6 pips, never the same as just before. animate(), not a CSS class: it plays on every tap and does not start by itself
// when the card appears (a class on <svg> could not be restarted — offsetWidth does not exist in SVG)
const RZUT = [{ transform: 'none', easing: 'ease-out' }, { transform: 'translateY(-7px) rotate(200deg)', offset: .45, easing: 'ease-out' },
  { transform: 'rotate(360deg)' }];
const OCZKA = [[[12, 12]], [[8, 8], [16, 16]], [[8, 8], [12, 12], [16, 16]], [[8, 8], [16, 8], [8, 16], [16, 16]],
  [[8, 8], [16, 8], [12, 12], [8, 16], [16, 16]], [[8, 7], [16, 7], [8, 12], [16, 12], [8, 17], [16, 17]]];
let scianka = 4;                                       // 5 pips — as on the icon
function rzutKostki() {
  scianka = (scianka + 1 + Math.floor(Math.random() * 5)) % 6;
  document.querySelectorAll('.losuj svg').forEach(svg => svg.animate(RZUT, 500));
  setTimeout(() => document.querySelectorAll('.losuj .oczka').forEach(g =>
    g.innerHTML = OCZKA[scianka].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.5"/>`).join('')), 225);
}

// 🎡 wheel for picking a number, endless like a phone alarm clock: finger up — larger, down — smaller, wrapping around
// (23 → 00, 55 → 00); a big number in the middle, faded neighbours above and below it; released — it snaps to the nearest,
// a fast flick carries on. Mouse wheel — by one. ile — the range (24 · 60), co — the step (minutes: the ⚙ step)
const KOLO_WIERSZ = 22;                          // 5 numbers are visible: 2 above, the middle one, 2 below
function Kolo(el, ile, co) {
  let pos = 0, jazda = 0, byla = 0, cel0 = 0;      // pos — which number is in the middle (in rows, not wrapped) · cel0 — where it is heading
  const n = () => ile / co;
  const wiersze = [-3, -2, -1, 0, 1, 2, 3].map(k => { const d = h('div', 'kolo-l'); el.append(d); return [k, d]; });
  function rysuj() {
    const N = n(), baza = Math.round(pos);
    wiersze.forEach(([k, d]) => {
      const i = baza + k, y = (i - pos) * KOLO_WIERSZ;
      d.textContent = dwie((i % N + N) % N * co);
      d.style.transform = `translateY(${y - KOLO_WIERSZ / 2}px)`;
      d.style.opacity = Math.max(0, 1 - Math.abs(y) / (KOLO_WIERSZ * 3.2));
      d.classList.toggle('srodek', k === 0);
    });
    if (baza !== byla) { byla = baza; if (window.Dzwiek) Dzwiek.tik(); }   // a tick at every new number, like the hand
  }
  function jedz(cel) {                           // smoothly to the number cel (~150 ms, longer after a flick)
    cel0 = cel;
    const nr = ++jazda, od = pos, ms = Math.min(500, 150 + Math.abs(cel - od) * 25), t0 = performance.now();
    (function krok(t) {
      if (nr !== jazda) return;
      const q = Math.min(1, (t - t0) / ms);
      pos = od + (cel - od) * (1 - (1 - q) ** 3);
      rysuj();
      if (q < 1) requestAnimationFrame(krok);
    })(t0);
  }
  let y0 = 0, p0 = 0, ostY = 0, ostT = 0, v = 0, trzyma = false;
  el.onpointerdown = e => { trzyma = true; jazda++; el.setPointerCapture(e.pointerId); y0 = ostY = e.clientY; p0 = pos; ostT = e.timeStamp; v = 0; };
  el.onpointermove = e => {
    if (!trzyma) return;
    const dt = e.timeStamp - ostT;
    if (dt > 0) v = -(e.clientY - ostY) / KOLO_WIERSZ / dt;   // rows per ms, upwards = +
    ostY = e.clientY; ostT = e.timeStamp;
    pos = p0 - (e.clientY - y0) / KOLO_WIERSZ;
    cel0 = Math.round(pos);
    rysuj();
  };
  el.onpointerup = el.onpointercancel = e => {
    if (!trzyma) return;
    trzyma = false;
    if (e.timeStamp - ostT > 80) v = 0;          // the finger rested before release — no flick
    jedz(Math.round(pos + v * 150));
  };
  el.onwheel = e => { e.preventDefault(); jedz(cel0 + Math.sign(e.deltaY)); };
  rysuj();
  return {
    get: () => { const N = n(); return (cel0 % N + N) % N * co; },
    set(v) { jazda++; pos = cel0 = Math.round(v / co); byla = pos; rysuj(); },
    o: d => jedz(cel0 + d),                      // ▲▼ — by one (from the target: quick presses add up)
    co(c) { const v = this.get(); co = c; this.set(Math.round(v / c) * c % 60); }
  };
}

let lekcja = -1;   // -1 = the lesson list

const STRZALKA = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

// a tile of the Lekcje / Ćwiczenia list: a small clock with a number, name + one line, ›
function kafelListy(nr, nazwa, opis, zegar, cls) {
  const b = h('button', 'lista-kafel ' + cls,
    `<span class="lista-zeg"><span class="lista-nr">${nr}</span></span><span class="tekst"><b>${nazwa}</b><small>${opis}</small></span>${STRZALKA}`);
  const svg = noweSvg('');
  b.querySelector('.lista-zeg').prepend(svg);
  Zegar(svg, Object.assign({ styl, cyfry: 'zwykle', rama: RAMA[styl] || '' }, zegar));
  return b;
}

function zbudujListe() {
  const box = document.getElementById('widok-lista');
  box.textContent = '';
  LEKCJE.forEach((l, i) => {
    const b = kafelListy(i + 1, l.nazwa, l.opis, l.zegar, 'lekcje');
    b.onclick = () => otworzLekcje(i);
    box.append(b);
  });
}

function zbudujLekcje() {
  const box = document.getElementById('lekcja');
  box.textContent = '';
  box.scrollTop = 0;
  LEKCJE[lekcja].buduj(box);
  const nast = LEKCJE[lekcja + 1];
  document.getElementById('dalej').textContent = nast ? `Dalej: ${nast.nazwa} →` : 'Wróć do listy';
}

function otworzLekcje(n) {
  lekcja = n;
  pokazWidok();
  simScreen(ekran());
}
document.getElementById('dalej').onclick = () => otworzLekcje(lekcja + 1 < LEKCJE.length ? lekcja + 1 : -1);

// ---- Ćwiczenia: levels; entry: Start → Ćwiczenia or ☰ ----
// temat — in the list (without „Poziom N"), in ☰ „Poziom N · temat"; opis — one short line, examples only;
// t + tylko — the small clock in the list: an example from the level, hands as in the round ('g' hour · 'm' minute · '' both)
const POZIOMY = [
  { nazwa: 'Poziom 1', temat: 'Godziny',     opis: '05:00, piąta',              t: 5 * 60,      tylko: 'g' },
  { nazwa: 'Poziom 2', temat: 'Minuty',      opis: '5, 10 … 55 minut',          t: 35,          tylko: 'm' },
  { nazwa: 'Poziom 3', temat: 'Po i za',     opis: 'pięć po, wpół do, za pięć', t: 50,          tylko: 'm' },
  { nazwa: 'Poziom 4', temat: 'Co 15 minut', opis: '07:45, wpół do ósmej',      t: 7 * 60 + 45, tylko: '' },
  { nazwa: 'Poziom 5', temat: 'Co 5 minut',  opis: '08:35, 11:10',              t: 8 * 60 + 35, tylko: '' },
  { nazwa: 'Poziom 6', temat: 'Słowami',     opis: 'za pięć siódma',            t: 6 * 60 + 55, tylko: '' },
  { nazwa: 'Poziom 7', temat: 'Po południu', opis: '14:25, 00:40',              t: 2 * 60 + 25, tylko: '' },
  { nazwa: 'Poziom 8', temat: 'Wcześniej, później', opis: '±10, ±15, ±20 minut', t: 2 * 60 + 5, tylko: '' },
  { nazwa: 'Poziom 9', temat: 'Ile minut?',  opis: '13:50 → 14:10',             t: 1 * 60 + 50, tylko: '' },
  { nazwa: 'Poziom 10', temat: 'Mistrz',     opis: '16:30, bez cyfr, XII',      t: 4 * 60 + 30, tylko: '' },
  // bonus: ★ instead of a number in the list; after level 10 „Następny poziom" leads here
  { nazwa: 'Bonus', temat: 'Ponad godzinę', opis: '08:20 + 1 godz. 25 min', t: 8 * 60 + 20, tylko: '', znak: '★' },
];
let poziom = -1;   // -1 = the level list
const cwBox = document.getElementById('widok-cw'), licznikEl = document.getElementById('licznik');

function zbudujPoziomy() {
  const box = document.getElementById('widok-cw-lista');
  box.textContent = '';
  POZIOMY.forEach((p, i) => {
    const b = kafelListy(p.znak || i + 1, p.temat, p.opis, { t: p.t, tylko: p.tylko }, 'cwiczenia');
    b.onclick = () => otworzPoziom(i);
    box.append(b);
  });
}

function otworzPoziom(n) {
  poziom = n;
  pokazWidok();
  if (n < 0) simScreen(ekran());   // a round reports its own screens itself (cwiczenia-1 …)
}

// ---- views: Start — the clock to drag and two buttons Trening · Ćwiczenia; ☰ on every screen (instead of ←):
// Start · Trening · Lekcje · the exercise levels · Karty pracy · Motyw. Trening has the key 'zegar'. ----
const WIDOKI = [['start', 'Start'], ['karty', 'Lekcje'], ['cwiczenia', 'Ćwiczenia'], ['zegar', 'Trening'], ['druk', 'Karty pracy']];
let widok = 'start';   // the app always opens on Start
const ekran = () => widok === 'start' ? 'start' : widok === 'zegar' ? 'zegar' : widok === 'druk' ? 'druk'
  : widok === 'karty' ? (lekcja < 0 ? 'lekcje' : 'lekcja-' + (lekcja + 1))
  : poziom < 0 ? 'cwiczenia' : 'poziom-' + (poziom + 1);

// icons on the Start buttons: Trening — a dial with hands, Ćwiczenia — ★ (Lekcje, „i" — now only in ☰)
const IKONA = d => `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IKONY = {
  karty: IKONA('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'),
  cwiczenia: IKONA('<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>'),
  zegar: IKONA('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'),
  druk: IKONA('<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/>')
};

// Start: the very first screen is already practice — a clock to drag, starting from the current time; under it two small
// buttons Trening · Ćwiczenia. Lekcje — in ☰. Above the clock the „Karty pracy" bar
function zbudujStart() {
  const box = document.getElementById('widok-start');
  box.textContent = '';
  const pas = h('button', 'start-pas', `<span class="ik ik-druk">${IKONY.druk}</span><b>${WIDOKI.find(([x]) => x === 'druk')[1]}</b>${STRZALKA}`);
  pas.onclick = () => idzDo('druk');
  const miejsce = h('div', 'trening'), tr = h('div', 'trening');
  tr.append(miejsce);
  const gora = h('div', 'start-gora');
  gora.append(tr);
  const rzad = h('div', 'start-rzad');
  ['zegar', 'cwiczenia'].forEach(k => {
    const b = h('button', null, `<span class="ik ik-${k}">${IKONY[k]}</span><b>${WIDOKI.find(([x]) => x === k)[1]}</b>`);
    b.onclick = () => idzDo(k);
    rzad.append(b);
  });
  box.append(pas, gora, rzad);
  zbudujTrening(miejsce);
}

let motywOtwarty = false;   // the Motyw submenu — stays open after a choice (☰ is rebuilt when the theme changes)
// ☰: Start · Trening · Lekcje · Ćwiczenia — a submenu with the levels (a tap starts the round at once) · Karty pracy · rule ·
// Motyw — a submenu
function zbudujNawigacje() {
  const ul = document.getElementById('menu-nawigacja');
  ul.textContent = '';
  const pozycja = (tekst, aktywna, idz, cls, gdzie = ul) => {
    const li = h('li', cls), a = h('a', aktywna ? 'menu-active' : null, tekst);
    a.onclick = () => { menuEl.checked = false; idz(); };
    li.append(a);
    gdzie.append(li);
  };
  pozycja('Start', widok === 'start', () => idzDo('start'));
  pozycja('Trening', widok === 'zegar', () => idzDo('zegar'));
  pozycja('Lekcje', widok === 'karty', () => idzDo('karty'));   // Lekcje — reachable only from here
  // Ćwiczenia — the levels in one submenu; open when we are in Ćwiczenia
  const li = h('li'), det = h('details'), pod = h('ul');
  det.open = widok === 'cwiczenia';
  det.append(h('summary', null, 'Ćwiczenia'), pod);
  li.append(det);
  ul.append(li);
  POZIOMY.forEach((p, i) => pozycja(`${p.nazwa} · ${p.temat}`, widok === 'cwiczenia' && poziom === i, () => {
    if (widok !== 'cwiczenia') { widok = 'cwiczenia'; lekcja = -1; log('widok: Ćwiczenia'); }
    otworzPoziom(i);
  }, null, pod));
  pozycja('Karty pracy', widok === 'druk', () => idzDo('druk'));
  // Motyw — a submenu too; a tap changes the theme at once, the menu and the submenu stay open; later Język goes here too
  const liM = h('li', 'oddzielnie'), detM = h('details'), podM = h('ul');
  detM.open = motywOtwarty;
  detM.ontoggle = () => { motywOtwarty = detM.open; };
  detM.append(h('summary', null, 'Motyw'), podM);
  liM.append(detM);
  ul.append(liM);
  const obecny = document.documentElement.dataset.theme;
  MOTYWY.forEach(([k, nazwa]) => {
    const li = h('li'), a = h('a', k === obecny ? 'menu-active' : null, `<span class="probka" data-theme="${k}"></span>${nazwa}`);
    a.onclick = () => { if (k !== obecny) ustawMotyw(k); };
    li.append(a);
    podM.append(li);
  });
}

function ustawMotyw(k) {
  document.documentElement.dataset.theme = k;
  try { localStorage.setItem('zegar-theme', k); } catch (e) {}
  log(`motyw: ${MOTYWY.find(([x]) => x === k)[1]}`);
  zbudujNawigacje();
}
// a theme chosen in the simulator (sim-bridge has already set data-theme) — the selection in ☰ follows it
addEventListener('message', e => { if (e.data && e.data.type === 'theme') zbudujNawigacje(); });

function pokazWidok() {
  const wLekcji = widok === 'karty' && lekcja >= 0, wRundzie = widok === 'cwiczenia' && poziom >= 0;
  document.getElementById('widok-start').hidden = widok !== 'start';
  document.getElementById('widok-lista').hidden = !(widok === 'karty' && lekcja < 0);
  document.getElementById('widok-lekcja').hidden = !wLekcji;
  document.getElementById('widok-cw-lista').hidden = !(widok === 'cwiczenia' && poziom < 0);
  cwBox.hidden = !wRundzie;
  document.getElementById('widok-zegar').hidden = widok !== 'zegar';
  document.getElementById('widok-druk').hidden = widok !== 'druk';
  document.body.classList.toggle('ekran-druk', widok === 'druk');   // @media print: only the sheet
  document.getElementById('przycisk-ustawien').hidden = widok !== 'zegar';   // ⚙ only in Trening
  document.getElementById('przycisk-wygladu').hidden = widok !== 'zegar' && widok !== 'start' && widok !== 'druk';   // 🕓 also on Start and at the sheet
  document.getElementById('przycisk-start').hidden = widok === 'start';       // 🏠 everywhere except Start
  licznikEl.hidden = !wRundzie;
  document.getElementById('przycisk-pomoc').hidden = !(wRundzie && samouczekJest(poziom));
  if (widok === 'zegar') pokazTryb();
  document.getElementById('tytul').textContent = wLekcji ? LEKCJE[lekcja].nazwa : wRundzie ? POZIOMY[poziom].nazwa
    : WIDOKI.find(([k]) => k === widok)[1];
  zbudujNawigacje();
  if (widok === 'start') zbudujStart();
  if (widok === 'karty') { if (wLekcji) zbudujLekcje(); else zbudujListe(); }
  if (widok === 'cwiczenia' && !wRundzie) zbudujPoziomy();
  if (widok === 'druk') druk(document.getElementById('widok-druk'));
  if (wRundzie) cwStart(cwBox, licznikEl, poziom, rundaPoziomu);   // the first time, the tutorial comes first
  else { cwBox.cwZnak = null; cwBox.textContent = ''; }   // leaving a round: its late setTimeout will do nothing any more
}

// a level round; at the end of the round: „Następny poziom" (absent after the last one) · „Poziomy" — the list
function rundaPoziomu() {
  const nast = poziom + 1 < POZIOMY.length ? poziom + 1 : -1;
  cwiczenia(cwBox, licznikEl, () => otworzPoziom(-1), poziom, undefined, nast < 0 ? null : () => otworzPoziom(nast));
}
// 💡 — the level's tutorial once more; „Wróć" at the end — the round starts over
document.getElementById('przycisk-pomoc').onclick = () => samouczek(cwBox, licznikEl, poziom, rundaPoziomu);

function idzDo(k) {
  if (k !== widok) { widok = k; log(`widok: ${WIDOKI.find(([x]) => x === k)[1]}`); }
  lekcja = -1;
  poziom = -1;
  pokazWidok();
  simScreen(ekran());
}
// Back (phone / ◀ in the simulator), step by step: lesson → lesson list, round → level list, the rest → Start
const cofnij = () => widok === 'karty' && lekcja >= 0 ? otworzLekcje(-1)
  : widok === 'cwiczenia' && poziom >= 0 ? otworzPoziom(-1) : idzDo('start');
// 🏠 — straight to Start, also from the middle of a round (without asking, like ☰ → Start)
document.getElementById('przycisk-start').onclick = () => idzDo('start');

// 🕓 „Wygląd zegara": a group with a title and 10:10 previews
function grupa(ul, tytul, opcje, wybrana, podglad, wybierz) {
  ul.append(h('li', 'menu-title', tytul));
  opcje.forEach(([k, nazwa]) => {
    const li = document.createElement('li'), a = document.createElement('a');
    if (k === wybrana) a.classList.add('menu-active');
    const svg = noweSvg('podglad');
    a.appendChild(svg);
    a.append(nazwa);
    Zegar(svg, podglad(k));
    a.onclick = () => { if (k !== wybrana) wybierz(k); };
    li.appendChild(a);
    ul.appendChild(li);
  });
}

// rebuilds only the list — the 🕓 drawer stays open after a choice
function zbudujMenu() {
  const ul = document.getElementById('menu-wyglad');
  ul.textContent = '';
  grupa(ul, 'Tarcza', STYLE, styl,
    k => ({ styl: k, cyfry, rama: RAMA[k] || '', t: PODGLAD_T }),
    k => { styl = k; zmienWyglad(); });
  grupa(ul, 'Cyfry', CYFRY, cyfry,
    k => ({ styl, cyfry: k, rama: RAMA[styl] || '', t: PODGLAD_T }),
    k => { cyfry = k; zmienWyglad(); });
}

function zmienWyglad() {
  try { localStorage.setItem('zegar-styl', styl); localStorage.setItem('zegar-cyfry', cyfry); } catch (e) {}
  log(`wygląd: ${styl} · ${cyfry}`);
  document.body.dataset.styl = styl;
  zbudujZegar();
  zbudujMenu();
  zbudujPrzelaczniki();
  if (widok === 'start') zbudujStart();
  if (widok === 'karty' && lekcja >= 0) zbudujLekcje();
  if (widok === 'druk') druk(document.getElementById('widok-druk'));
}

// ◀ in the simulator / Back on the phone: first closes the menu / settings / appearance, then cofnij(); on Start — exit
const ustawEl = document.getElementById('ustawienia');
const wygladEl = document.getElementById('wyglad');
const capApp = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App;   // only in the APK
window.simBack = () => {
  if (menuEl.checked) menuEl.checked = false;
  else if (ustawEl.checked) ustawEl.checked = false;
  else if (wygladEl.checked) wygladEl.checked = false;
  else if (widok !== 'start') cofnij();
  else if (capApp) capApp.exitApp();
  else history.back();
};
// APK: the phone's Back button goes through simBack instead of closing the app
if (capApp) capApp.addListener('backButton', () => simBack());
menuEl.addEventListener('change', () => simScreen(menuEl.checked ? 'menu' : ekran()));
ustawEl.addEventListener('change', () => simScreen(ustawEl.checked ? 'ustawienia' : ekran()));
wygladEl.addEventListener('change', () => simScreen(wygladEl.checked ? 'wyglad' : ekran()));

// for checking: ?menu=1 · ?ustawienia=1 · ?wyglad=1 (the 🕓 „Wygląd zegara" drawer) · ?widok=start|zegar|karty|cwiczenia|druk ·
// ?lekcja=2 (from 1) · ?poziom=1 (from 1)
const q = new URLSearchParams(location.search);
if (WIDOKI.some(([k]) => k === q.get('widok'))) widok = q.get('widok');
if (q.get('lekcja')) { widok = 'karty'; lekcja = Math.min(LEKCJE.length, Math.max(1, +q.get('lekcja') || 1)) - 1; }
if (q.get('poziom')) { widok = 'cwiczenia'; poziom = Math.min(POZIOMY.length, Math.max(1, +q.get('poziom') || 1)) - 1; }
if (q.get('menu') === '1') menuEl.checked = true;
if (q.get('ustawienia') === '1') { widok = 'zegar'; ustawEl.checked = true; }
if (q.get('wyglad') === '1') { widok = 'zegar'; wygladEl.checked = true; }

document.body.dataset.styl = styl;
document.body.classList.toggle('bez-nieba', dzienNoc === 'nie');
zbudujZegar();
zbudujRodzaje();
nastepne();                                  // the first Trening task
zbudujPrzelaczniki();
zbudujMenu();
pokazNapis();
pokazKarte();
pokazWidok();
</script>
</body>
</html>
